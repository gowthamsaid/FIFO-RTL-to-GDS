name: Render routed GDSII previews

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_gds_previews.py"
      - "layout/**"
      - ".github/workflows/render-gds-previews.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages Pillow
      - name: Render 8x16 and 32x32 GDSII previews
        run: python3 scripts/render_gds_previews.py
      - name: Commit resulting images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/fifo_8x16_routed.png docs/images/fifo_32x32_routed.png
          if ! git diff --cached --quiet; then
            git commit -m "Add routed layout previews generated from GDSII"
            git push
          fi
